services:
  thermostat:
    build: .
    container_name: thermostat-monitor
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      POLL_SECONDS: 300
      HOMEKIT_POLL_SECONDS: 0
      RESIDEO_CLIENT_ID: ${RESIDEO_CLIENT_ID:-}
      RESIDEO_CLIENT_SECRET: ${RESIDEO_CLIENT_SECRET:-}
      RESIDEO_REDIRECT_URI: ${RESIDEO_REDIRECT_URI:-http://10.0.0.117:8787/auth/callback}
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
